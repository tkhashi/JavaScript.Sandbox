<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Canvas → フォルダ分け ZIP デモ</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    #preview img { width: 120px; margin: .25rem; border:1px solid #ccc; }
  </style>
</head>
<body>
  <h1>Canvas 画像をフォルダ分けして ZIP ダウンロード</h1>

  <label>生成枚数:
    <input id="count" type="number" value="10" min="1" max="500">
  </label>
  <button id="go">Generate &amp; Download</button>

  <h2>プレビュー（最大20枚）</h2>
  <div id="preview"></div>

  <!-- Vite が ESModule 版 main.js を注入 -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
